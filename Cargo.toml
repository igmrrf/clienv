[package]
name = "bsec"
version = "0.1.0"
authors = ["The Lazy <francis.igbiriki@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "a tool to manage your env variables"
readme = "README.md"
homepage = "https://bsec.dev"
repository = "https://github.com/igmrrf/bsec"
keywords = ["cli", "env", "manage", "track", "encrypt"]
categories = ["command-line-utilities", "virtualization"]
edition = "2024"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
log = "0.4.26"
anyhow = "1.0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
aes-gcm = "0.10.3"
base64 = "0.22.1"
lazy_static = "1.5.0"
sha2 = "0.10.8"
sha3 = "0.10.8"
yaml_serde = "0.10"
tempfile = "3.19.0"
dirs = "6.0.0"
zeroize = { version = "1.8.1", features = ["derive"] }
rpassword = "7.3.0"
argon2 = "0.5.3"
bip39 = "2.1.0"
bip32 = "0.5.3"
k256 = { version = "0.13.4", features = ["ecdsa", "arithmetic", "ecdh"] }
rand = "0.8.5"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
thiserror = "2.0.12"
clap_complete = "4.5.44"

[dev-dependencies]
assert_cmd = "2.0.16"
assert_fs = "1.1.2"
predicates = "3.1.3"
proptest = "1.6.0"


